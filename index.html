    <!-- Loaded without blocking the first paint: `media="print"` makes the
         browser fetch it at a low priority and not hold rendering for it, and
         the onload flip promotes it the moment it lands. As a plain
         stylesheet link this was the largest delay before anything appeared.

         Two families, and the pairing is the whole type system: Dancing
         Script writes the word "Hello", Sora sets everything else. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Sora:wght@200;300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Sora:wght@200;300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
