<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jahongir Abrorkulov — Full-stack engineer</title>

    <meta
      name="description"
      content="Jahongir Abrorkulov, 16, full-stack engineer from Tashkent. A flight from the real Earth to the edge of the galaxy, rendered live in your browser, with every project on a planet and a crackme on Pluto."
    />
    <meta name="author" content="Jahongir Abrorkulov" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abrorkulov.uz/" />
    <meta property="og:title" content="Jahongir Abrorkulov — Full-stack engineer" />
    <meta property="og:description" content="A flight from Tashkent to the edge of the galaxy, rendered live in your browser." />
    <!-- A real 1200×630 PNG: Telegram, LinkedIn and Twitter do not render an
         SVG preview, so a link to the site used to arrive with no card. -->
    <meta property="og:image" content="https://abrorkulov.uz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Earth from orbit, with Tashkent marked" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://abrorkulov.uz/og.png" />
    <meta name="twitter:title" content="Jahongir Abrorkulov — Full-stack engineer" />
    <meta name="twitter:description" content="A flight from Tashkent to the edge of the galaxy, rendered live in your browser." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" href="/fonts/jost.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The first thing on screen. Everything further out loads as the camera nears it. -->
    <link rel="preload" href="/space/earth-day.webp" as="image" type="image/webp" />

    <!-- Before the first paint, so panels can start hidden for the observer to
         reveal, and a visitor with scripts off still sees every word. -->
    <script>
      document.documentElement.classList.add('js')
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jahongir Abrorkulov",
        "url": "https://abrorkulov.uz/",
        "image": "https://abrorkulov.uz/og.png",
        "jobTitle": "Full-stack engineer",
        "sameAs": [
          "https://github.com/abrorkulov",
          "https://linkedin.com/in/jahongir-abrorkulov",
          "https://t.me/ejodocome"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Tashkent",
          "addressCountry": "Uzbekistan"
        },
        "knowsAbout": [
          "React",
          "TypeScript",
          "React Native",
          "Node.js",
          "PostgreSQL",
          "C++",
          "C#",
          "Reverse engineering",
          "AI Engineering"
        ],
        "alumniOf": [
          { "@type": "EducationalOrganization", "name": "Cambridge Learning Center" },
          { "@type": "EducationalOrganization", "name": "Najot Ta'lim" },
          { "@type": "EducationalOrganization", "name": "MARS IT School" }
        ]
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
